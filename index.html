<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Streaming</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(20px);
    z-index:999;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.menu{
    display:flex;
    gap:30px;
}

.menu a{
    color:white;
    text-decoration:none;
    opacity:.8;
    transition:.3s;
}

.menu a:hover{
    opacity:1;
}

/* HERO */

.hero{
    height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,.2),
        rgba(0,0,0,.8)
    ),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    padding:100px;
}

.hero-content{
    max-width:600px;
}

.hero h1{
    font-size:70px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    line-height:1.5;
    opacity:.9;
}

.buttons{
    margin-top:30px;
    display:flex;
    gap:15px;
}

.btn{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.btn-primary{
    background:white;
    color:black;
}

.btn-primary:hover{
    transform:scale(1.05);
}

.btn-secondary{
    background:rgba(255,255,255,.2);
    color:white;
}

/* SEÇÕES */

.section{
    padding:40px 50px;
}

.section h2{
    margin-bottom:20px;
}

/* CARROSSEL */

.carousel{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding-bottom:10px;
}

.carousel::-webkit-scrollbar{
    display:none;
}

.card{
    min-width:280px;
    height:160px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    transition:.4s;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card:hover{
    transform:scale(1.08);
}

.card-title{
    position:absolute;
    bottom:10px;
    left:10px;
    font-weight:bold;
}

/* MODAL PLAYER */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.modal.active{
    display:flex;
}

.modal iframe{
    width:90%;
    height:80%;
    border:none;
    border-radius:15px;
}

.close{
    position:absolute;
    top:30px;
    right:40px;
    font-size:40px;
    cursor:pointer;
}

@media(max-width:768px){

.hero{
    padding:30px;
}

.hero h1{
    font-size:45px;
}

nav{
    padding:20px;
}

.menu{
    display:none;
}

.card{
    min-width:220px;
}
}
</style>
</head>

<body>

<nav>
    <div class="logo">POLY TV+</div>

    <div class="menu">
        <a href="#">Início</a>
        <a href="#">Séries</a>
        <a href="#">Filmes</a>
        <a href="#">Minha Lista</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-content">

        <h1 id="heroTitle">Carregando...</h1>

        <p id="heroDescription">
            Carregando descrição...
            </p>

        <div class="buttons">
            <button class="btn btn-primary"
            onclick="abrirFilme(550)">
                ▶ Assistir
            </button>

            <button class="btn btn-secondary">
                + Minha Lista
            </button>
        </div>

    </div>
</section>

<section class="section">
    <h2>🎬 Filmes</h2>
    <div class="carousel" id="filmes"></div>
</section>

<section class="section">
    <h2>📺 Séries</h2>
    <div class="carousel" id="series"></div>
</section>

<section class="section">
    <h2>✨ Animações</h2>
    <div class="carousel" id="animacoes"></div>
</section>

<!-- PLAYER -->

<div class="modal" id="player">

    <span class="close" onclick="closeVideo()">
        ×
    </span>

    <iframe
    id="movieFrame"
    width="90%"
    height="80%"
    frameborder="0"
    allowfullscreen
    loading="lazy">
</iframe>

</div>

<script>

const TMDB_KEY = "ead2df33a9f69aa41137a4aa80ddaee4";
const TMDB_URL = "https://api.themoviedb.org/3";
const IMG_W780 = "https://image.tmdb.org/t/p/w780";
const IMG_ORIGINAL = "https://image.tmdb.org/t/p/original";

const player =
document.getElementById("player");

const movieFrame =
document.getElementById("movieFrame");

function abrirFilme(id){

movieFrame.src =
`https://myembed.biz/filme/${id}`;

player.classList.add("active");
}

function abrirSerie(id){

movieFrame.src =
`https://myembed.biz/serie/${id}`;

player.classList.add("active");
}

function closeVideo(){

player.classList.remove("active");

movieFrame.src = "";
}

player.addEventListener("click",(e)=>{
    if(e.target === player){
        closeVideo();
    }
});

async function carregarHero(){

const req = await fetch(
    `${TMDB_URL}/trending/all/week?api_key=${TMDB_KEY}&language=pt-BR`
);

const data = await req.json();

const destaque =
    data.results[Math.floor(Math.random() * data.results.length)];

document.getElementById("heroTitle").textContent =
    destaque.title || destaque.name;

document.getElementById("heroDescription").textContent =
    destaque.overview || "Sem descrição";

if(destaque.backdrop_path){

    document.querySelector(".hero").style.backgroundImage = `
        linear-gradient(
            rgba(0,0,0,.2),
            rgba(0,0,0,.8)
        ),
        url(${IMG_ORIGINAL}${destaque.backdrop_path})
    `;
}
}

async function carregarFilmes(){

const req = await fetch(
    `${TMDB_URL}/movie/popular?api_key=${TMDB_KEY}&language=pt-BR&page=1`
);

const data = await req.json();

const container =
    document.getElementById("filmes");

container.innerHTML = "";

data.results.forEach(filme => {

    if(!filme.backdrop_path) return;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <img src="${IMG_W780}${filme.backdrop_path}">
        <div class="card-title">${filme.title}</div>
    `;

    card.addEventListener("click", () => {
    abrirFilme(filme.id);
});

container.appendChild(card);

});

}

async function carregarSeries(){

const req = await fetch(
    `${TMDB_URL}/tv/popular?api_key=${TMDB_KEY}&language=pt-BR&page=1`
);

const data = await req.json();

const container =
    document.getElementById("series");

container.innerHTML = "";

data.results.forEach(serie => {

    if(!serie.backdrop_path) return;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <img src="${IMG_W780}${serie.backdrop_path}">
        <div class="card-title">${serie.name}</div>
    `;

    card.addEventListener("click", () => {
    abrirSerie(serie.id);
});

container.appendChild(card);

});

}

async function carregarAnimacoes(){

const req = await fetch(
    `${TMDB_URL}/discover/movie?api_key=${TMDB_KEY}&language=pt-BR&with_genres=16`
);

const data = await req.json();

const container =
    document.getElementById("animacoes");

container.innerHTML = "";

data.results.forEach(animacao => {

    if(!animacao.backdrop_path) return;

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <img src="${IMG_W780}${animacao.backdrop_path}">
        <div class="card-title">${animacao.title}</div>
    `;

    card.addEventListener("click", () => {
    abrirFilme(animacao.id);
});

container.appendChild(card);

});

}

carregarHero();
carregarFilmes();
carregarSeries();
carregarAnimacoes();

</script>

</body>
</html>
